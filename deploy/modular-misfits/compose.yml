name: modular-misfits-opensign

services:
  database:
    build:
      context: .
      dockerfile: Dockerfile.postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opensign}
      POSTGRES_USER: ${POSTGRES_USER:-opensign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - opensign-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: ../../apps/OpenSignServer
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URI: postgresql://${POSTGRES_USER:-opensign}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-opensign}
      APP_ID: ${APP_ID:-opensign}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      SERVER_URL: ${SERVER_URL:-https://sign.modularmisfits.io/api/app}
      PUBLIC_URL: ${PUBLIC_URL:-https://sign.modularmisfits.io}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://sign.modularmisfits.io}
      MASTER_KEY_IPS: 127.0.0.1/32,::1/128
      USE_LOCAL: "true"
      APP_NAME: ${APP_NAME:-Modular Misfits Agreements}
      SMTP_ENABLE: "true"
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_USER_EMAIL: ${SMTP_USER_EMAIL:?SMTP_USER_EMAIL is required}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PFX_BASE64: ${PFX_BASE64:?PFX_BASE64 is required}
      PASS_PHRASE: ${PASS_PHRASE:?PASS_PHRASE is required}
      PORTAL_BRIDGE_SECRET: ${PORTAL_BRIDGE_SECRET:?PORTAL_BRIDGE_SECRET is required}
      PORTAL_WEBHOOK_URL: ${PORTAL_WEBHOOK_URL:-https://misfits.modularmisfits.io/api/nda/webhooks/opensign}
      PORTAL_WEBHOOK_SECRET: ${PORTAL_WEBHOOK_SECRET:?PORTAL_WEBHOOK_SECRET is required}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:?TELNYX_PUBLIC_KEY is required}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID:?TELNYX_MESSAGING_PROFILE_ID is required}
      TELNYX_FAILOVER_SECRET: ${TELNYX_FAILOVER_SECRET:?TELNYX_FAILOVER_SECRET is required}
      TELNYX_PRIMARY_WEBHOOK_URL: ${TELNYX_PRIMARY_WEBHOOK_URL:-https://misfits.modularmisfits.io/api/nda/webhooks/telnyx}
      PORTAL_OWNER_EMAIL: ${PORTAL_OWNER_EMAIL:?PORTAL_OWNER_EMAIL is required}
      PORTAL_OWNER_NAME: ${PORTAL_OWNER_NAME:-Modular Misfits Agreements}
      PORTAL_OWNER_COMPANY: ${PORTAL_OWNER_COMPANY:-Modular Misfits}
      PORTAL_TEMPLATE_DIR: /run/portal-nda-templates
      PORTAL_TEMPLATE_CONFIG: /run/portal-nda-config/layout.json
    volumes:
      - opensign-files:/app/files
      - opensign-exports:/app/exports
      - ${PORTAL_NDA_TEMPLATE_DIR:?PORTAL_NDA_TEMPLATE_DIR is required}:/run/portal-nda-templates:ro
      - ${PORTAL_NDA_CONFIG_DIR:?PORTAL_NDA_CONFIG_DIR is required}:/run/portal-nda-config:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ../../apps/OpenSign
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    environment:
      REACT_APP_SERVERURL: ${SERVER_URL:-https://sign.modularmisfits.io/api/app}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    ports:
      - 127.0.0.1:${OPENSIGN_PORT:-3100}:3001
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=16m,mode=0700
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  opensign-postgres:
  opensign-files:
  opensign-exports:
